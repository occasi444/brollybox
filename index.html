<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrollyBox</title>

    <style>
        /* Reset für saubere Ränder ohne weiße Blitzer */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* Navigationsleiste mit deinem Original-Orange */
        .navigation {
            width: 100%;
            height: 100px;
            background-color: orange;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px; /* Angenehmer Abstand zwischen den Elementen */
        }

        /* Grundstyling für alle Links */
        .navigation a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.2s ease-in-out;
        }

        /* Logo-Styling (hebt sich von den Buttons ab) */
        .navigation a.logo {
            font-weight: 800;
            font-size: 1.5rem;
            margin-right: 15px; /* Schafft etwas Platz vor den Buttons */
        }

        /* Das gewünschte Button-Styling (mit Rand und Abhebung) */
        .navigation a.nav-button {
            font-weight: 600;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.1); /* Leicht dunkler Hintergrund */
            border: 2px solid white; /* Weißer Rand */
            border-radius: 6px; /* Abgerundete Ecken */
        }

        /* Hover-Effekt: Button invertiert sich beim Drüberfahren */
        .navigation a.nav-button:hover {
            background-color: white;
            color: orange;
        }

        /* Layout-Sicherung für die Karte */
        main {
            width: 100%;
            display: block;
        }

        iframe {
            border: none;
            display: block; /* Verhindert Abstände unter der Karte */
        }
    </style>
</head>
<body>
    <header>
        <div class="navigation">
            <!-- Klassen hinzugefügt, um Logo und Buttons optisch zu trennen -->
            <a href="index.html" class="logo">BrollyBox</a>
            <a href="how-to-use.html" class="nav-button">How to use</a>
            <a href="our-products.html" class="nav-button">Our Product</a>
        </div> <!-- HTML-Fehler korrigiert (vorher </navigation>) -->
    </header>
    <main>
        <iframe
           src="https://www.google.com/maps/d/embed?mid=11Xdvpw4goEBmLQX8VqQjerLgc9CLfEA&ehbc=2E312F&noprof=1" width="100%" height="480">
        </iframe>
    </main>    
</body>
</html>
