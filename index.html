<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automaten Standorte</title>
    <style>
        /* Entfernt alle Ränder und füllt den kompletten Bildschirm */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        /* Der Container maskiert die obere Leiste */
        .map-container {
            width: 100%;
            /* Erhöht die Höhe leicht, um das Abschneiden unten auszugleichen */
            height: calc(100% + 55px); 
            position: relative;
            overflow: hidden;
            /* Schiebt den gesamten Inhalt um die Höhe der Leiste nach oben */
            top: -55px; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

  <div class="map-container">
      <iframe src="https://www.google.com/maps/d/embed?mid=1e-gXb_vA-mIol0gNfI_lI2Xy4bI" allowfullscreen></iframe>
  </div>

</body>
</html>
