
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automaten Standorte</title>
    <style>
        /* Entfernt alle Ränder und füllt den kompletten Bildschirm */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

  <iframe src="https://www.google.com/maps/d/embed?mid=11Xdvpw4goEBmLQX8VqQjerLgc9CLfEA&ehbc=2E312F&noprof=1" width="640" height="480"></iframe>

</body>
</html>
